name: Sync All Forks

on:
  schedule:
    - cron: "0 13/24 * * *" 
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync all repos (clean stale bot commits and bypass cache)'
        required: false
        default: false
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sync-center
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # 恢复缓存状态
      - name: Restore Sync State
        uses: actions/cache/restore@v4
        with:
          path: sync_state.json
          key: sync-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            sync-state-${{ runner.os }}-

      # 执行同步脚本
      - name: Run sync
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FORCE_SYNC: ${{ inputs.force_sync || false }}
        run: |
          chmod +x scripts/sync.sh
          ./scripts/sync.sh repos.json

      # 保存新的缓存状态
      - name: Save Sync State
        if: success()
        uses: actions/cache/save@v4
        with:
          path: sync_state.json
          key: sync-state-${{ runner.os }}-${{ github.run_id }}
